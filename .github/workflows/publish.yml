name: Release

on:
  push:
    branches:
      - main
      - 'feature-*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository == 'kanyun-inc/reskill' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v6 or newer is required: earlier versions bootstrap with a pnpm 8 that
      # cannot install the pnpm 11 pinned in packageManager (it unpacks the
      # tarball but leaves node_modules/.bin/pnpm dangling).
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # No registry-url: it would make setup-node write an .npmrc with
      # `_authToken=${NODE_AUTH_TOKEN}`, and a static token takes us off the
      # trusted publishing path. Auth comes from OIDC (see permissions above).
      # '22.x' also keeps us above the Node >= 22.13 that pnpm 11 requires.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # pnpm 11 reads its own settings from pnpm_config_* only; the npm_config_*
          # form is ignored, which would leave provenance up to auto-detection.
          pnpm_config_provenance: true

  beta-release:
    name: Beta Release
    runs-on: ubuntu-latest
    if: github.repository == 'kanyun-inc/reskill' && startsWith(github.ref, 'refs/heads/feature-')
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # See the note in the release job: no registry-url, auth comes from OIDC.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check pre-release mode
        id: check-pre
        run: |
          if [ -f ".changeset/pre.json" ]; then
            TAG=$(jq -r '.tag' .changeset/pre.json)
            if [ "$TAG" = "beta" ]; then
              echo "is_pre=true" >> $GITHUB_OUTPUT
            else
              echo "::warning::pre.json exists but tag is '$TAG', expected 'beta'. Skipping."
              echo "is_pre=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "is_pre=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip notice
        if: steps.check-pre.outputs.is_pre != 'true'
        run: echo "::notice::Not in beta pre-release mode. Skipping beta publish."

      - name: Version packages (beta)
        if: steps.check-pre.outputs.is_pre == 'true'
        run: pnpm changeset version

      - name: Check for version changes
        if: steps.check-pre.outputs.is_pre == 'true'
        id: check-version
        run: |
          if git diff --quiet package.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "::notice::No version changes detected. Package may already be at this version."
          else
            NEW_VERSION=$(node -e "console.log(require('./package.json').version)")
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "::notice::Version bumped to $NEW_VERSION"
          fi

      - name: Run tests
        if: steps.check-pre.outputs.is_pre == 'true' && steps.check-version.outputs.has_changes == 'true'
        run: pnpm test:run

      - name: Build
        if: steps.check-pre.outputs.is_pre == 'true' && steps.check-version.outputs.has_changes == 'true'
        run: pnpm build

      - name: Publish beta to npm
        if: steps.check-pre.outputs.is_pre == 'true' && steps.check-version.outputs.has_changes == 'true'
        run: pnpm changeset publish
        env:
          # See the note in the release job on the pnpm_config_ prefix.
          pnpm_config_provenance: true

      - name: Commit version bump back to branch
        if: steps.check-pre.outputs.is_pre == 'true' && steps.check-version.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md .changeset/pre.json
          git commit -m "chore: release beta ${{ steps.check-version.outputs.new_version }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
